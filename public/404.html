<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Behna Clothing Studio</title>
    <!--
      GitHub Pages SPA fallback. Serves index.html for unknown paths by
      encoding the requested route into a query string, which index.html
      restores. pathSegmentsToKeep = 0 because the site is served from the
      root of a custom domain (behna.in).
    -->
    <script>
      var pathSegmentsToKeep = 0;
      var l = window.location;
      l.replace(
        l.protocol +
          '//' +
          l.hostname +
          (l.port ? ':' + l.port : '') +
          l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') +
          '/?/' +
          l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
          (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
          l.hash,
      );
    </script>
  </head>
  <body></body>
</html>
